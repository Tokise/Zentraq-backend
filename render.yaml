services:
  - type: web
    name: zentraq-api-gateway
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @zentraq/shared build && pnpm --filter @zentraq/api-gateway build
    startCommand: pnpm --filter @zentraq/api-gateway start
    healthCheckPath: /health
    buildFilter:
      paths:
        - services/api-gateway/**
        - packages/shared/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_EDGE_FUNCTIONS_URL
        sync: false
      - key: EDGE_GATEWAY_HMAC_SECRET
        sync: false
      - key: INTERNAL_CONTEXT_SECRET
        sync: false
      - key: APPOINTMENT_SERVICE_URL
        sync: false
      - key: INVENTORY_SERVICE_URL
        sync: false
      - key: NOTIFICATION_SERVICE_URL
        sync: false
      - key: REPORTING_SERVICE_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: SERVICE_TIMEOUT_MS
        value: "65000"

  - type: web
    name: zentraq-appointments
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @zentraq/shared build && pnpm --filter @zentraq/appointment-service build
