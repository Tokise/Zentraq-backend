    healthCheckPath: /health
    buildFilter:
      paths:
        - services/appointment-service/**
        - packages/shared/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NOTIFICATION_SERVICE_URL
        sync: false
      - key: REPORTING_SERVICE_URL
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: INTERNAL_CONTEXT_SECRET
        sync: false

  - type: web
    name: zentraq-inventory
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @zentraq/shared build && pnpm --filter @zentraq/inventory-service build
    startCommand: pnpm --filter @zentraq/inventory-service start
    healthCheckPath: /health
    buildFilter:
      paths:
        - services/inventory-service/**
        - packages/shared/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REPORTING_SERVICE_URL
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: INTERNAL_CONTEXT_SECRET
        sync: false

  - type: web
    name: zentraq-notifications
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @zentraq/shared build && pnpm --filter @zentraq/notification-service build
    startCommand: pnpm --filter @zentraq/notification-service start
    healthCheckPath: /health
    buildFilter:
      paths:
        - services/notification-service/**
        - packages/shared/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: INTERNAL_CONTEXT_SECRET
        sync: false
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
      - key: GOOGLE_GMAIL_ENABLED
        value: "false"
      - key: GOOGLE_GMAIL_CLIENT_ID
        sync: false
      - key: GOOGLE_GMAIL_CLIENT_SECRET
        sync: false
      - key: GOOGLE_GMAIL_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_GMAIL_SENDER
        sync: false
      - key: GOOGLE_GMAIL_ALLOWED_DOMAIN
        sync: false
      - key: GOOGLE_GMAIL_ALLOWED_RECIPIENTS
        sync: false

  - type: web
    name: zentraq-reporting
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @zentraq/shared build && pnpm --filter @zentraq/reporting-service build
