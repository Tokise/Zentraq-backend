    buildFilter:
      paths:
        - services/identity-service/**
        - packages/shared/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: INTERNAL_CONTEXT_SECRET
        sync: false

