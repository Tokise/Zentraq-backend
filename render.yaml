        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: INTERNAL_CONTEXT_SECRET
        sync: false
      - key: NOTIFICATION_SERVICE_URL
        sync: false
      - key: GOOGLE_DRIVE_ENABLED
        value: "false"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON_BASE64
        sync: false
      - key: GOOGLE_DRIVE_PRODUCTION_FOLDER_ID
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_ALLOWED_WORKSPACE_DOMAIN
        sync: false

  - type: web
    name: zentraq-ai
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @zentraq/shared build && pnpm --filter @zentraq/ai-service build
    startCommand: pnpm --filter @zentraq/ai-service start
