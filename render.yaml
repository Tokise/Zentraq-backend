services:
  - type: web
    name: zentraq-api-gateway
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @zentraq/shared build && pnpm --filter @zentraq/api-gateway build
    startCommand: pnpm --filter @zentraq/api-gateway start
    healthCheckPath: /health
    buildFilter:
      paths:
        - services/api-gateway/**
        - packages/shared/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: IDENTITY_SERVICE_URL
        sync: false
      - key: CLINICAL_SERVICE_URL
        sync: false
      - key: APPOINTMENT_SERVICE_URL
        sync: false
      - key: INVENTORY_SERVICE_URL
        sync: false
      - key: NOTIFICATION_SERVICE_URL
        sync: false
      - key: REPORTING_SERVICE_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: INTERNAL_CONTEXT_SECRET
        sync: false
      - key: SERVICE_TIMEOUT_MS
        value: "8000"

